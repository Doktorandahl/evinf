# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, 'round*', 'perf-*', 'families-*', 'audit-*']
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # round12 A4: pinned to the package's declared floor (DESCRIPTION
          # says R >= 4.1.0). 'oldrel-1' floats with each R release and had
          # already drifted past 4.3 by the time round11 ran on 4.5.2, which
          # is how the drop.terms() crash on R 4.3 (round12 A1) escaped CI.
          - {os: ubuntu-latest,  r: '4.3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # round10 0.8 (review §7): a truncated RSPM binary download (seen on
      # macOS) failed the dependency step on the first attempt of every PR,
      # though a later run always passed. An explicit cache-version pins a
      # cache key for this step (r-lib/actions caches per-OS/r-version
      # already, but this makes the key -- and any future manual bust of it
      # -- explicit), and the retry-on-failure step below covers a fresh,
      # uncached run where the download itself is flaky.
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: setup-r-deps
        continue-on-error: true
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 1

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.setup-r-deps.outcome == 'failure'
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 1

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--no-build-vignettes")'
